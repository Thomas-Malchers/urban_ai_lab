site_name: Urban AI Lab
site_description: L0, L1, and selected L2 architecture for urban data and AI
site_url: https://thomas-malchers.github.io/urban_ai_lab/
repo_url: https://github.com/Thomas-Malchers/urban_ai_lab
edit_uri: edit/main/docs/

# Existing detail pages remain in the repository as a knowledge base, but are
# excluded from the visible website and its search index.
exclude_docs: |
  00_overview/
  01_overall-architecture/
  02_data-platform/
  03_data-domains/
  04_ai-platform/
  05_data-products/
  06_use-cases/
  07_interfaces/
  08_operations/
  09_decisions/
  10_templates/
  l0-zielbild.md
  l1-datenarchitektur.md
  assets/**/*.md

theme:
  name: material
  language: en
  features:
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - "L0 – Overall Architecture": l0-gesamtarchitektur.md
  - "L1 – Data Platform": l1-data-platform.md
  - "L1 – AI / Model Platform": l1-ai-model-platform.md
  - "L2 – Architecture Building Blocks":
      - "Domain Data Processing": l2-domain-processing.md
      - "Storage & Access": l2-storage-access.md
      - "Data Integration & Transformation": l2-data-integration-transformation.md
      - "AI / Model Platform":
          - "Model Lifecycle": l2-ai-model-lifecycle.md
          - "Geospatial Inference & Postprocessing": l2-geospatial-inference-postprocessing.md
  - Data Domains: data-domains.md
  - "Decisions & Open Questions": offene-fragen.md
