site_name: Urban AI Lab
site_description: L0-, L1- und ausgewählte L2-Architektur für urbane Daten und KI
site_url: https://thomas-malchers.github.io/urban_ai_lab/
repo_url: https://github.com/Thomas-Malchers/urban_ai_lab
edit_uri: edit/main/docs/

# Bestehende Detailseiten bleiben als Wissensbestand im Repository, sind aber
# weder Teil der sichtbaren Website noch ihres Suchindex.
exclude_docs: |
  00_overview/
  01_overall-architecture/
  02_data-platform/
  03_data-domains/
  04_ai-platform/
  05_data-products/
  06_use-cases/
  07_interfaces/
  08_operations/
  09_decisions/
  10_templates/
  l0-zielbild.md
  l1-datenarchitektur.md
  assets/**/*.md

theme:
  name: material
  language: de
  features:
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start: index.md
  - "L0 – Gesamtarchitektur": l0-gesamtarchitektur.md
  - "L1 – Data Platform": l1-data-platform.md
  - "L1 – AI / Model Platform": l1-ai-model-platform.md
  - "L2 – Architekturbausteine":
      - "Domain Data Processing": l2-domain-processing.md
      - "Storage & Access": l2-storage-access.md
      - "Data Integration & Transformation": l2-data-integration-transformation.md
      - "AI Model Lifecycle": l2-ai-model-lifecycle.md
  - Data Domains: data-domains.md
  - "Entscheidungen & offene Fragen": offene-fragen.md
