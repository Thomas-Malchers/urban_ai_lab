site_name: Urban AI Lab – Data Architecture
site_description: Zielbild und logische Architektur des Urban Data Layer
site_url: https://thomas-malchers.github.io/urban_ai_lab/
repo_url: https://github.com/Thomas-Malchers/urban_ai_lab
edit_uri: edit/main/docs/

# Bestehende Detailseiten bleiben als Wissensbestand im Repository, sind aber
# weder Teil der sichtbaren Website noch ihres Suchindex.
exclude_docs: |
  00_overview/
  01_overall-architecture/
  02_data-platform/
  03_data-domains/
  04_ai-platform/
  05_data-products/
  06_use-cases/
  07_interfaces/
  08_operations/
  09_decisions/
  10_templates/
  assets/

theme:
  name: material
  language: de
  features:
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start: index.md
  - "L0 – Zielbild": l0-zielbild.md
  - "L1 – Datenarchitektur": l1-datenarchitektur.md
  - Data Domains: data-domains.md
  - "Entscheidungen & offene Fragen": offene-fragen.md
