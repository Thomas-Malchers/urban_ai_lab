site_name: Urban AI Lab Architecture
site_description: Technische Architektur- und Plattformdokumentation
site_url: https://example.org/urban-ai-lab-architecture/
repo_url: https://example.org/urban-ai-lab-architecture
edit_uri: edit/main/docs/
not_in_nav: |
  assets/**
theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.indexes
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Start: index.md
  - Überblick:
      - Vision: 00_overview/vision.md
      - Scope: 00_overview/scope.md
      - Architekturprinzipien: 00_overview/architecture-principles.md
      - Dokumentationsstrategie: 00_overview/documentation-strategy.md
      - Roadmap: 00_overview/roadmap.md
  - Gesamtarchitektur:
      - Systemkontext: 01_overall-architecture/system-context.md
      - Capability Map: 01_overall-architecture/capability-map.md
      - Logische Architektur: 01_overall-architecture/logical-architecture.md
      - End-to-End-Datenfluss: 01_overall-architecture/end-to-end-data-flow.md
      - Übergreifende Fähigkeiten: 01_overall-architecture/cross-cutting-capabilities.md
  - Urban Data Platform:
      - Überblick: 02_data-platform/overview.md
      - Ingestion und Storage: 02_data-platform/ingestion-and-storage.md
      - Datenprodukte: 02_data-platform/data-products.md
      - Integriertes Objektmodell: 02_data-platform/integrated-urban-data-model.md
      - Metadaten, Versionierung und Lineage: 02_data-platform/metadata-versioning-lineage.md
      - Datenzugriff: 02_data-platform/data-access.md
  - Data Domains:
      - Überblick: 03_data-domains/overview.md
      - Orthofotos:
