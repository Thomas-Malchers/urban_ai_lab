name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-docs.txt
      - run: python scripts/validate-yaml.py
      - name: Check required structure
        run: test -f README.md && test -f CONTRIBUTING.md && test -f docs/index.md
      - run: mkdocs build --strict
